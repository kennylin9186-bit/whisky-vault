<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>全球社交品飲筆記 | Global Tasting Salon</title>
  
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#09080b',
            charcoal: '#121117',
            lounge: '#181620',
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309'
            },
            copper: '#c27847'
          },
          fontFamily: {
            serif: ['Cinzel', 'Noto Serif TC', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #09080b;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2a2736;
      border-radius: 4px;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col pb-24 selection:bg-amber-500/30 selection:text-amber-200">

  <!-- 頂部導航列 -->
  <header class="sticky top-0 z-40 bg-obsidian/90 backdrop-blur-md border-b border-amber-900/30 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <span class="text-xl">🥃</span>
        <div>
          <h1 class="text-base sm:text-lg font-serif font-bold tracking-wider text-amber-400">全球社交品飲筆記</h1>
          <p class="text-[9px] font-mono tracking-widest text-zinc-500 uppercase -mt-0.5">Global Tasting Salon</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="document.getElementById('importFileInput').click()" class="text-xs px-2.5 py-1.5 rounded-lg border border-zinc-700 hover:border-amber-500/50 text-zinc-300 hover:text-amber-300 transition">
          📥 匯入
        </button>
        <button onclick="exportJSON()" class="text-xs px-2.5 py-1.5 rounded-lg border border-zinc-700 hover:border-amber-500/50 text-zinc-300 hover:text-amber-300 transition">
          📦 匯出
        </button>
        <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="handleImportFile(event)">
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-4xl mx-auto w-full px-4 pt-4 flex-1">
    
    <!-- 搜尋與分類篩選 -->
    <div class="space-y-3 mb-6">
      <div class="relative">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋酒名、蒸餾廠、產區、桶型或風味..." class="w-full bg-lounge/80 border border-zinc-800 rounded-xl px-4 py-2.5 pl-10 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500/60 focus:ring-1 focus:ring-amber-500/40">
        <span class="absolute left-3.5 top-2.5 text-zinc-500 text-sm">🔍</span>
      </div>

      <!-- 分類標籤 (威士忌置頂首位) -->
      <div id="categoryContainer" class="flex space-x-2 overflow-x-auto pb-1 custom-scrollbar text-xs"></div>
    </div>

    <!-- 筆記卡片網格 -->
    <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <!-- 空白提示 -->
    <div id="emptyState" class="hidden py-16 text-center space-y-3">
      <div class="text-4xl opacity-60">🥃</div>
      <p class="text-zinc-400 text-sm">尚無相關品飲筆記</p>
      <button onclick="openNoteModal()" class="text-xs text-amber-400 underline underline-offset-4">立即記錄第一支佳釀</button>
    </div>
  </main>

  <!-- 手機底部浮動新增按鈕 (FAB) -->
  <div class="fixed bottom-6 right-6 z-30">
    <button onclick="openNoteModal()" class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-obsidian font-semibold rounded-full p-4 shadow-xl flex items-center justify-center space-x-2 transition active:scale-95">
      <span class="text-xl leading-none">＋</span>
      <span class="text-xs tracking-wider pr-1">新增品飲筆記</span>
    </button>
  </div>

  <!-- 新增/編輯 抽屜式 Modal -->
  <div id="noteModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-charcoal border border-amber-900/40 w-full max-w-2xl max-h-[92vh] rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
      
      <!-- Modal 標題列 -->
      <div class="px-5 py-4 border-b border-zinc-800 flex items-center justify-between bg-lounge/50">
        <h3 id="modalTitle" class="text-sm font-serif font-bold text-amber-400 tracking-wide">記錄全新佳釀</h3>
        <button onclick="closeNoteModal()" class="text-zinc-400 hover:text-zinc-100 text-xl leading-none p-1">✕</button>
      </div>

      <!-- Modal 表單主體 -->
      <div class="overflow-y-auto px-5 py-4 space-y-4 custom-scrollbar text-sm">
        
        <!-- 照片預覽與上傳/拍攝操作區 -->
        <div class="space-y-2">
          <label class="block text-xs font-medium text-zinc-400">酒瓶 / 酒標照片</label>
          <div class="relative w-full h-44 bg-lounge border border-dashed border-zinc-700 rounded-xl overflow-hidden flex flex-col items-center justify-center group">
            <img id="formPhotoPreview" class="w-full h-full object-cover hidden">
            
            <div id="formPhotoPlaceholder" class="flex flex-col items-center text-zinc-500 space-y-1">
              <span class="text-3xl">📷</span>
              <span class="text-xs">尚未加入照片</span>
            </div>

            <!-- 照片動作按鈕列 -->
            <div class="absolute bottom-2 inset-x-2 flex justify-end">
              <input type="file" id="cameraInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
              <button type="button" onclick="document.getElementById('cameraInput').click()" class="bg-obsidian/85 hover:bg-black text-zinc-200 border border-zinc-700 text-xs px-3 py-1.5 rounded-lg backdrop-blur-sm transition flex items-center space-x-1">
                <span>📷 拍照 / 上傳酒標</span>
              </button>
            </div>
          </div>
        </div>

        <!-- 種類與酒名（含即時智慧快選下拉） -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">酒款類別</label>
            <select id="formType" onchange="handleWineTypeChange(this.value)" class="w-full bg-lounge border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 text-xs focus:outline-none focus:border-amber-500">
              <option value="威士忌">威士忌 (Whisky)</option>
              <option value="紅葡萄酒">紅葡萄酒 (Red Wine)</option>
              <option value="白葡萄酒">白葡萄酒 (White Wine)</option>
              <option value="日本清酒">日本清酒 (Sake)</option>
              <option value="琴酒 / 調酒">琴酒 / 調酒 (Spirits)</option>
            </select>
          </div>

          <div class="sm:col-span-2 relative">
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-medium text-zinc-400">酒款全名 / 簡稱</label>
              <span class="text-[10px] text-amber-500/80 font-mono">支援關鍵字快選 (如 mac, ardbeg, 百富, 山崎)</span>
            </div>
            <input type="text" id="formName" oninput="handleNameInput(this.value)" placeholder="輸入關鍵字立即套用內建資料庫..." class="w-full bg-lounge border border-zinc-800 rounded-lg px-3 py-2 text-zinc-100 text-xs focus:outline-none focus:border-amber-500">
            
            <!-- 即時智慧下拉補全清單 -->
            <div id="autocompleteList" class="absolute left-0 right-0 top-full mt-1 bg-obsidian border border-amber-900/60 rounded-lg shadow-2xl z-30 max-h-56 overflow-y-auto hidden divide-y divide-zinc-800/80 custom-scrollbar"></div>
          </div>
        </div>

        <!-- 內建資料庫提示卡片 -->
        <div class="bg-amber-950/20 border border-amber-900/30 rounded-xl px-3.5 py-2.5 flex items-center justify-between">
          <div class="text-[11px] text-zinc-300">
            <span class="text-amber-400 font-semibold">⚡ 本地智慧資料庫：</span>
            選中酒款將自動帶出酒廠、產區、官方 ABV%、桶型、量化滑桿與風味輪！
          </div>
        </div>

        <!-- 酒廠產區、桶型、酒精濃度與年份批次 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">蒸餾廠 / 酒莊</label>
            <input type="text" id="formDistillery" placeholder="例：The Macallan" class="w-full bg-lounge border border-zinc-800 rounded-lg px-2.5 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">產區 / 國家</label>
            <input type="text" id="formRegion" placeholder="例：Speyside, Scotland" class="w-full bg-lounge border border-zinc-800 rounded-lg px-2.5 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">酒精濃度 (ABV %)</label>
            <input type="text" id="formAbv" placeholder="43%" class="w-full bg-lounge border border-zinc-800 rounded-lg px-2.5 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">桶型 / 批次號</label>
            <input type="text" id="formCask" placeholder="Sherry Oak / Cask #32" class="w-full bg-lounge border border-zinc-800 rounded-lg px-2.5 py-1.5 text-zinc-100 text-xs focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <!-- 五維感官量化結構 -->
        <div class="border border-zinc-800 rounded-xl p-3.5 bg-lounge/40 space-y-3">
          <div class="flex items-center justify-between">
            <span id="sensoryModeTitle" class="text-xs font-serif font-semibold text-amber-300">感官五維量化評鑑</span>
            <span class="text-[10px] text-zinc-500">1 (極輕微) 至 5 (濃郁顯著)</span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs" id="slidersContainer"></div>
        </div>

        <!-- 風味標籤速選 -->
        <div class="space-y-1.5">
          <label class="block text-xs font-medium text-zinc-400">風味輪標籤 (可點選快速標註)</label>
          <div id="flavorTagSelector" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 酒廠風土與簡介 -->
        <div class="space-y-1">
          <label class="block text-xs font-medium text-zinc-400">酒廠歷史、風土工藝與特色描述</label>
          <textarea id="formBackground" rows="3" placeholder="記錄該酒款釀造工藝、特色用桶歷史或個人收藏備註..." class="w-full bg-lounge border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-200 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <!-- 個人品飲手記與星級評分 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2 space-y-1">
            <label class="block text-xs font-medium text-zinc-400">個人品飲隨筆 (當日心境、搭餐、開瓶表現)</label>
            <textarea id="formUserNotes" rows="2" placeholder="在酒吧純飲品嚐，加水一滴後綻放柑橘皮與可可香氣..." class="w-full bg-lounge border border-zinc-800 rounded-lg p-2 text-xs text-zinc-200 focus:outline-none focus:border-amber-500"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-2">私藏推薦評分</label>
            <div id="starRatingContainer" class="flex items-center space-x-1.5 text-2xl text-amber-500 cursor-pointer"></div>
            <input type="hidden" id="formRating" value="5">
          </div>
        </div>

      </div>

      <!-- Modal 底部按鈕 -->
      <div class="px-5 py-3 border-t border-zinc-800 bg-lounge/60 flex items-center justify-end space-x-2">
        <button onclick="closeNoteModal()" class="px-4 py-2 rounded-lg text-xs text-zinc-400 hover:text-zinc-200 transition">取消</button>
        <button onclick="saveCurrentNote()" class="px-5 py-2 rounded-lg text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-obsidian transition">儲存典藏</button>
      </div>

    </div>
  </div>

  <script>
    // =========================================================================
    // 完整旗艦酒款內建資料庫 (涵蓋各大威士忌產區、紅白酒與清酒)
    // =========================================================================

      // --- 島嶼區與高地 (Islands & Highlands) ---

      },
      {
        name: "Highland Park 12 Years Old",

        distillery: "Highland Park",
        region: "Orkney Islands, Scotland",
        abv: "40%",

        sweet: 3, peat: 2, spice: 2, body: 3, finish: 3,

      },
      {
        name: "Springbank 10 Years Old (雲頂10年)",
        type: "威士忌",
        distillery: "Springbank",
        region: "Campbeltown, Scotland",

    function renderCategoryFilter() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = CATEGORIES.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-full border transition whitespace-nowrap ${currentCategory === cat ? 'bg-amber-500 border-amber-400 text-obsidian font-semibold' : 'bg-lounge border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryFilter();
      renderNotes();
    }

    function handleSearch() {
      renderNotes();
    }

    function renderNotes() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('notesGrid');
      const empty = document.getElementById('emptyState');

      const filtered = notes.filter(n => {
        const matchCat = currentCategory === '全部' || n.type === currentCategory;
        const matchQuery = !query || 
          n.name.toLowerCase().includes(query) ||
          (n.distillery && n.distillery.toLowerCase().includes(query)) ||
          (n.region && n.region.toLowerCase().includes(query)) ||
          (n.cask && n.cask.toLowerCase().includes(query)) ||
          (n.tags && n.tags.some(t => t.toLowerCase().includes(query)));
        return matchCat && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      grid.innerHTML = filtered.map(note => {
        const isWhisky = note.type === '威士忌';
        const labels = isWhisky 
          ? ['麥芽甘甜', '泥煤煙燻', '辛香酒勁', '油脂厚度', '餘韻長度']
          : ['甜度', '酸度', '單寧澀感', '酒體厚度', '餘韻長度'];
        
        return `
          <div class="bg-charcoal border border-zinc-800 hover:border-amber-900/60 rounded-xl overflow-hidden flex flex-col justify-between transition hover:shadow-lg">
            <div>
              ${note.photo ? `
                <div class="w-full h-44 bg-zinc-900 overflow-hidden relative">
                  <img src="${note.photo}" class="w-full h-full object-cover">
                  <div class="absolute inset-0 bg-gradient-to-t from-charcoal via-transparent to-transparent"></div>
                  <span class="absolute top-3 left-3 bg-obsidian/80 backdrop-blur-md border border-amber-900/40 text-[11px] text-amber-300 font-medium px-2 py-0.5 rounded-full">
                    ${note.type}
                  </span>
                  ${note.abv ? `
                    <span class="absolute top-3 right-3 bg-obsidian/80 backdrop-blur-md border border-zinc-700 text-[11px] text-zinc-300 font-mono px-2 py-0.5 rounded-full">
                      ${note.abv}
                    </span>
                  ` : ''}
                </div>
              ` : `
                <div class="p-3 bg-lounge/60 border-b border-zinc-800/80 flex items-center justify-between">
                  <span class="bg-amber-950/60 text-amber-300 border border-amber-800/40 text-[11px] px-2 py-0.5 rounded-full font-medium">${note.type}</span>${note.abv ? `<span class="text-zinc-400 font-mono text-xs">${note.abv}</span>` : ''}
                </div>
              `}

              <div class="p-4 space-y-3">
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <h3 class="font-serif font-bold text-base text-zinc-100 leading-snug">${note.name}</h3>
                    <p class="text-xs text-amber-400/90 mt-0.5">${note.distillery || ''} ${note.region ? `· ${note.region}` : ''}</p>
                    ${note.cask ? `<p class="text-[11px] text-zinc-400 mt-0.5">桶型: ${note.cask}</p>` : ''}
                  </div>
                  <div class="text-amber-400 text-xs shrink-0 tracking-tighter">
                    ${'★'.repeat(note.rating)}${'☆'.repeat(5 - note.rating)}
                  </div>
                </div>

                <!-- 五維指標柱狀顯示 -->
                <div class="bg-lounge/40 rounded-lg p-2.5 space-y-1.5 text-[11px]">
                  ${labels.map((lbl, idx) => {
                    const val = note.sliders ? (note.sliders['s' + (idx+1)] || 3) : 3;
                    return `
                      <div class="flex items-center justify-between">
                        <span class="text-zinc-400">${lbl}</span>
                        <div class="w-32 bg-zinc-800 h-1.5 rounded-full overflow-hidden flex">
                          <div class="bg-gradient-to-r from-amber-600 to-amber-400 h-full rounded-full" style="width: ${(val / 5) * 100}%"></div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <!-- 風味標籤 -->
                ${note.tags && note.tags.length ? `
                  <div class="flex flex-wrap gap-1">
                    ${note.tags.map(t => `<span class="text-[10px] px-2 py-0.5 rounded-md bg-zinc-800/80 text-zinc-300 border border-zinc-700/60">${t}</span>`).join('')}
                  </div>
                ` : ''}

                <!-- 背景與筆記 -->
                ${note.background ? `
                  <p class="text-xs text-zinc-400 bg-obsidian/40 border-l-2 border-amber-700/50 pl-2.5 py-1 line-clamp-3">
                    ${note.background}
                  </p>
                ` : ''}

                ${note.userNotes ? `
                  <p class="text-xs text-zinc-300 italic pt-1">
                    "${note.userNotes}"
                  </p>
                ` : ''}
              </div>
            </div>

            <!-- 卡片底欄動作 -->
            <div class="px-4 py-2.5 border-t border-zinc-800/80 bg-lounge/30 flex items-center justify-between text-xs text-zinc-500">
              <span>${note.date || ''}</span>
              <div class="flex items-center space-x-3">
                <button onclick="editNote('${note.id}')" class="hover:text-amber-300 transition">編輯</button>
                <button onclick="deleteNote('${note.id}')" class="hover:text-rose-400 transition">刪除</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // =========================================================================
    // 智慧輸入模糊補全機制 (全面支援內建名酒庫即時套用)
    // =========================================================================
    function handleNameInput(val) {
      const list = document.getElementById('autocompleteList');
      const input = val.toLowerCase().trim();
      if (!input || input.length < 1) {
        list.classList.add('hidden');
        return;
      }

      // 中英文雙向模糊篩選
      const matches = COMPREHENSIVE_PRESETS.filter(item => {
        const itemStr = `${item.name} ${item.distillery} ${item.region}`.toLowerCase();
        return itemStr.includes(input) ||
          (input.includes("mac") || input.includes("麥")) && item.distillery.toLowerCase().includes("macallan") ||
          (input.includes("bal") || input.includes("百富")) && item.distillery.toLowerCase().includes("balvenie") ||
          (input.includes("ard") || input.includes("阿貝")) && item.distillery.toLowerCase().includes("ardbeg") ||
          (input.includes("laga") || input.includes("樂加")) && item.distillery.toLowerCase().includes("lagavulin") ||
          (input.includes("laph") || input.includes("拉佛")) && item.distillery.toLowerCase().includes("laphroaig") ||
          (input.includes("tali") || input.includes("泰斯")) && item.distillery.toLowerCase().includes("talisker") ||
          (input.includes("kav") || input.includes("噶瑪蘭")) && item.distillery.toLowerCase().includes("kavalan") ||
          (input.includes("山崎") || input.includes("yama")) && item.name.includes("山崎") ||
          (input.includes("白州") || input.includes("haku")) && item.name.includes("白州") ||
          (input.includes("響") || input.includes("hibiki")) && item.name.includes("響") ||
          (input.includes("獺祭") || input.includes("dassai")) && item.name.includes("獺祭");
      });

      if (matches.length === 0) {
        list.classList.add('hidden');
        return;
      }

      list.innerHTML = matches.map((m, idx) => `
        <div onclick="applyPresetByIndex(${COMPREHENSIVE_PRESETS.indexOf(m)})" class="px-3.5 py-2.5 hover:bg-amber-950/50 cursor-pointer flex flex-col transition group">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-amber-300 group-hover:text-amber-200">${m.name}</span>
            <span class="text-[10px] text-amber-500/80 bg-amber-950/60 border border-amber-800/40 px-1.5 py-0.5 rounded">${m.type}</span>
          </div>
          <span class="text-[11px] text-zinc-400 mt-0.5">${m.distillery} · ${m.region} · ${m.abv} · ${m.cask}</span>
        </div>
      `).join('');
      list.classList.remove('hidden');
    }

    function applyPresetByIndex(index) {
      const item = COMPREHENSIVE_PRESETS[index];
      if (!item) return;

      document.getElementById('formType').value = item.type;
      handleWineTypeChange(item.type);

      document.getElementById('formName').value = item.name;
      document.getElementById('formDistillery').value = item.distillery;
      document.getElementById('formRegion').value = item.region;
      document.getElementById('formAbv').value = item.abv;
      document.getElementById('formCask').value = item.cask;
      document.getElementById('formBackground').value = item.background || "";
      
      setSliderVal('s1', item.sweet);
      setSliderVal('s2', item.peat);
      setSliderVal('s3', item.spice);
      setSliderVal('s4', item.body);
      setSliderVal('s5', item.finish);

      selectedTags = new Set(item.tags || []);
      renderTagSelector(item.type);
      document.getElementById('autocompleteList').classList.add('hidden');
    }

    // 點擊空白處關閉快選下拉
    document.addEventListener('click', (e) => {
      const list = document.getElementById('autocompleteList');
      const input = document.getElementById('formName');
      if (e.target !== list && e.target !== input) {
        list.classList.add('hidden');
      }
    });

    function handleWineTypeChange(type) {
      renderSlidersForType(type);
      renderTagSelector(type);
    }

    function renderSlidersForType(type) {
      const container = document.getElementById('slidersContainer');
      const title = document.getElementById('sensoryModeTitle');
      const isWhisky = (type === '威士忌');
      
      title.innerText = isWhisky ? "威士忌專屬五維量化評鑑" : "標準感官五維評鑑";

      const defs = isWhisky ? [
        { id: 's1', name: '甜潤感 / 麥芽甜 (Sweetness)', low: '清冽乾淨', high: '濃醇甘甜' },
        { id: 's2', name: '泥煤 / 煙燻度 (Peat & Smoke)', low: '無泥煤', high: '重度泥煤' },
        { id: 's3', name: '辛香感 / 酒精衝勁 (Spice & Kick)', low: '溫潤順口', high: '辛香衝勁' },
        { id: 's4', name: '油脂感 / 酒體厚度 (Mouthfeel)', low: '輕盈爽脆', high: '極致油潤' },
        { id: 's5', name: '餘韻長度 (Finish Length)', low: '轉瞬即逝', high: '悠長延綿' }
      ] : [
        { id: 's1', name: '甜度 (Sweetness)', low: '乾型 (Dry)', high: '甜型 (Sweet)' },
        { id: 's2', name: '酸度 (Acidity)', low: '柔和低酸', high: '清脆高酸' },
        { id: 's3', name: '單寧澀度 (Tannin)', low: '絲滑無澀', high: '緊緻厚重' },
        { id: 's4', name: '酒體厚度 (Body)', low: '輕盈纖細', high: '飽滿渾厚' },
        { id: 's5', name: '餘韻長度 (Finish)', low: '簡短爽快', high: '細膩綿長' }
      ];

      container.innerHTML = defs.map(d => `
        <div class="space-y-1">
          <div class="flex justify-between text-zinc-400">
            <span>${d.name}</span>
            <span id="label-${d.id}" class="text-amber-400 font-mono">3 / 5</span>
          </div>
          <input type="range" id="input-${d.id}" min="1" max="5" value="3" oninput="updateSliderDisplay('${d.id}')" class="w-full accent-amber-500 bg-zinc-800 rounded-lg cursor-pointer">
          <div class="flex justify-between text-[9px] text-zinc-500">
            <span>${d.low}</span>
            <span>${d.high}</span>
          </div>
        </div>
      `).join('');
    }

    function updateSliderDisplay(id) {
      const val = document.getElementById('input-' + id).value;
      document.getElementById('label-' + id).innerText = `${val} / 5`;
    }

    function setSliderVal(id, val) {
      const el = document.getElementById('input-' + id);
      if (el) {
        el.value = val;
        updateSliderDisplay(id);
      }
    }

    function getSlidersVal() {
      return {
        s1: parseInt(document.getElementById('input-s1')?.value || 3),
        s2: parseInt(document.getElementById('input-s2')?.value || 3),
        s3: parseInt(document.getElementById('input-s3')?.value || 3),
        s4: parseInt(document.getElementById('input-s4')?.value || 3),
        s5: parseInt(document.getElementById('input-s5')?.value || 3)
      };
    }

    function renderTagSelector(type) {
      const container = document.getElementById('flavorTagSelector');
      const list = FLAVOR_LIBRARY[type] || FLAVOR_LIBRARY['通用'];
      
      container.innerHTML = list.map(t => {
        const isSel = selectedTags.has(t);
        return `
          <button type="button" onclick="toggleTag('${t}')" class="text-xs px-2.5 py-1 rounded-full border transition ${isSel ? 'bg-amber-600 border-amber-500 text-obsidian font-semibold' : 'bg-lounge border-zinc-800 text-zinc-400 hover:text-zinc-200'}">
            ${t}
          </button>
        `;
      }).join('');
    }

    function toggleTag(tag) {
      if (selectedTags.has(tag)) selectedTags.delete(tag);
      else selectedTags.add(tag);
      renderTagSelector(document.getElementById('formType').value);
    }

    function renderStarRatingInput(score) {
      const container = document.getElementById('starRatingContainer');
      container.innerHTML = [1,2,3,4,5].map(i => `
        <span onclick="setRating(${i})" class="hover:scale-110 transition ${i <= score ? 'text-amber-400' : 'text-zinc-700'}">★</span>
      `).join('');
      document.getElementById('formRating').value = score;
    }

    function setRating(val) {
      renderStarRatingInput(val);
    }

    // 本機相片上傳與 Canvas 壓縮
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.82);
          setModalPhoto(compressed);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setModalPhoto(url) {
      const preview = document.getElementById('formPhotoPreview');
      const placeholder = document.getElementById('formPhotoPlaceholder');
      if (url) {
        preview.src = url;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        preview.src = '';
        preview.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    function openNoteModal(isEdit = false) {
      if (!isEdit) {
        currentEditingId = null;
        document.getElementById('modalTitle').innerText = "記錄全新佳釀";
        document.getElementById('formType').value = "威士忌";
        document.getElementById('formName').value = "";
        document.getElementById('formDistillery').value = "";
        document.getElementById('formRegion').value = "";
        document.getElementById('formAbv').value = "";
        document.getElementById('formCask').value = "";
        document.getElementById('formBackground').value = "";
        document.getElementById('formUserNotes').value = "";
        setModalPhoto("");
        selectedTags.clear();
        handleWineTypeChange("威士忌");
        renderStarRatingInput(5);
      }
      document.getElementById('noteModal').classList.remove('hidden');
    }

    function closeNoteModal() {
      document.getElementById('noteModal').classList.add('hidden');
    }

    function editNote(id) {
      const n = notes.find(x => x.id === id);
      if (!n) return;

      currentEditingId = id;
      document.getElementById('modalTitle').innerText = "編輯品酩筆記";
      document.getElementById('formType').value = n.type || "威士忌";
      document.getElementById('formName').value = n.name || "";
      document.getElementById('formDistillery').value = n.distillery || "";
      document.getElementById('formRegion').value = n.region || "";
      document.getElementById('formAbv').value = n.abv || "";
      document.getElementById('formCask').value = n.cask || "";
      document.getElementById('formBackground').value = n.background || "";
      document.getElementById('formUserNotes').value = n.userNotes || "";
      setModalPhoto(n.photo || "");

      handleWineTypeChange(n.type || "威士忌");
      if (n.sliders) {
        setSliderVal('s1', n.sliders.s1 || 3);
        setSliderVal('s2', n.sliders.s2 || 3);
        setSliderVal('s3', n.sliders.s3 || 3);
        setSliderVal('s4', n.sliders.s4 || 3);
        setSliderVal('s5', n.sliders.s5 || 3);
      }
      selectedTags = new Set(n.tags || []);
      renderTagSelector(n.type || "威士忌");
      renderStarRatingInput(n.rating || 5);

      openNoteModal(true);
    }

    function deleteNote(id) {
      if (!confirm("確定要將這支品飲筆記自沙龍閣中移除嗎？")) return;
      notes = notes.filter(x => x.id !== id);
      saveNotesToStorage();
      renderNotes();
    }

    function saveCurrentNote() {
      const name = document.getElementById('formName').value.trim();
      if (!name) {
        alert("請輸入酒款名稱");
        return;
      }

      const noteData = {
        id: currentEditingId || ('vault-' + Date.now()),
        type: document.getElementById('formType').value,
        name: name,
        distillery: document.getElementById('formDistillery').value.trim(),
        region: document.getElementById('formRegion').value.trim(),
        abv: document.getElementById('formAbv').value.trim(),
        cask: document.getElementById('formCask').value.trim(),
        rating: parseInt(document.getElementById('formRating').value || 5),
        photo: document.getElementById('formPhotoPreview').src || "",
        sliders: getSlidersVal(),
        tags: Array.from(selectedTags),
        background: document.getElementById('formBackground').value.trim(),
        userNotes: document.getElementById('formUserNotes').value.trim(),
        date: new Date().toISOString().split('T')[0]
      };

      if (currentEditingId) {
        const idx = notes.findIndex(x => x.id === currentEditingId);
        if (idx !== -1) notes[idx] = noteData;
      } else {
        notes.unshift(noteData);
      }

      saveNotesToStorage();
      renderNotes();
      closeNoteModal();
    }

    // JSON 匯出與匯入
    function exportJSON() {
      if (notes.length === 0) {
        alert("目前尚無品飲筆記可匯出！");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
      const downloadAnchor = document.createElement('a');
      const date = new Date().toISOString().split('T')[0];
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `GlobalTasting_Backup_${date}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert("匯入失敗：檔案格式不符合規範。");
            return;
          }

          const mode = confirm("點擊「確定」將備份合併至現有筆記；點擊「取消」則完全覆蓋現有筆記。");
          if (mode) {
            const existingIds = new Set(notes.map(n => n.id));
            const newItems = imported.filter(n => !existingIds.has(n.id));
            notes = [...newItems, ...notes];
          } else {
            notes = imported;
          }

          saveNotesToStorage();
          renderNotes();
          alert("🎉 筆記已成功還原！");
        } catch (err) {
          alert("讀取備份檔案失敗，請確認檔案是否損壞。");
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  </script>
